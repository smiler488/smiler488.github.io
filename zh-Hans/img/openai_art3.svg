<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="30%" stop-color="#B8E6B8"/>
      <stop offset="60%" stop-color="#4a8c5c"/>
      <stop offset="100%" stop-color="#2d5a35"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.15" r="0.4">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffe082" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffb74d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0"/>
    </radialGradient>
    <!-- Light ray gradient -->
    <linearGradient id="rayGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff8e1" stop-opacity="0"/>
    </linearGradient>
    <!-- Leaf color variations -->
    <linearGradient id="leaf1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb85c"/>
      <stop offset="100%" stop-color="#3d7a3d"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ec96e"/>
      <stop offset="100%" stop-color="#4a8c4a"/>
    </linearGradient>
    <linearGradient id="leaf3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aad4a"/>
      <stop offset="100%" stop-color="#2d6b2d"/>
    </linearGradient>
    <!-- Photosynthesis glow -->
    <radialGradient id="photoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#90EE90" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#90EE90" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Sun glow at top center -->
  <rect width="1200" height="800" fill="url(#sunGlow)"/>

  <!-- Sun rays -->
  <g opacity="0.3">
    <polygon points="580,0 620,0 750,800 650,800" fill="url(#rayGrad)"/>
    <polygon points="500,0 530,0 600,800 520,800" fill="url(#rayGrad)" opacity="0.5"/>
    <polygon points="670,0 700,0 800,800 720,800" fill="url(#rayGrad)" opacity="0.5"/>
    <polygon points="420,0 445,0 480,800 410,800" fill="url(#rayGrad)" opacity="0.3"/>
    <polygon points="755,0 780,0 870,800 800,800" fill="url(#rayGrad)" opacity="0.3"/>
  </g>

  <!-- Canopy layer - back (darker, distant) -->
  <g opacity="0.5">
    <!-- Tree trunks in background -->
    <rect x="150" y="200" width="20" height="600" fill="#3d2b1f" rx="5"/>
    <rect x="400" y="150" width="25" height="650" fill="#3d2b1f" rx="5"/>
    <rect x="700" y="180" width="22" height="620" fill="#3d2b1f" rx="5"/>
    <rect x="950" y="160" width="28" height="640" fill="#3d2b1f" rx="5"/>
    <rect x="1100" y="200" width="18" height="600" fill="#3d2b1f" rx="5"/>

    <!-- Distant canopy leaves -->
    <ellipse cx="160" cy="180" rx="120" ry="100" fill="#2d5a2d"/>
    <ellipse cx="410" cy="130" rx="150" ry="120" fill="#2d6b2d"/>
    <ellipse cx="710" cy="160" rx="130" ry="110" fill="#2d5a2d"/>
    <ellipse cx="960" cy="140" rx="160" ry="130" fill="#2d6b2d"/>
    <ellipse cx="1110" cy="180" rx="110" ry="90" fill="#2d5a2d"/>
  </g>

  <!-- Canopy layer - middle -->
  <g opacity="0.7">
    <!-- More tree trunks -->
    <rect x="50" y="300" width="30" height="500" fill="#4a3728" rx="8"/>
    <rect x="280" y="250" width="35" height="550" fill="#4a3728" rx="8"/>
    <rect x="550" y="280" width="28" height="520" fill="#4a3728" rx="8"/>
    <rect x="830" y="260" width="32" height="540" fill="#4a3728" rx="8"/>
    <rect x="1050" y="290" width="26" height="510" fill="#4a3728" rx="8"/>

    <!-- Middle canopy -->
    <ellipse cx="65" cy="270" rx="140" ry="110" fill="url(#leaf3)"/>
    <ellipse cx="295" cy="220" rx="160" ry="130" fill="url(#leaf1)"/>
    <ellipse cx="565" cy="250" rx="145" ry="120" fill="url(#leaf3)"/>
    <ellipse cx="845" cy="230" rx="155" ry="125" fill="url(#leaf1)"/>
    <ellipse cx="1065" cy="260" rx="135" ry="115" fill="url(#leaf3)"/>
  </g>

  <!-- Canopy layer - front (brightest, closest) -->
  <g>
    <!-- Front tree trunks -->
    <rect x="-20" y="350" width="40" height="450" fill="#5a4030" rx="10"/>
    <rect x="200" y="320" width="38" height="480" fill="#5a4030" rx="10"/>
    <rect x="470" y="340" width="35" height="460" fill="#5a4030" rx="10"/>
    <rect x="720" y="310" width="42" height="490" fill="#5a4030" rx="10"/>
    <rect x="980" y="330" width="36" height="470" fill="#5a4030" rx="10"/>
    <rect x="1160" y="350" width="40" height="450" fill="#5a4030" rx="10"/>

    <!-- Branches reaching across -->
    <path d="M 20,380 Q 100,340 200,360" stroke="#5a4030" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 220,350 Q 320,310 400,340" stroke="#5a4030" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 490,370 Q 580,330 680,350" stroke="#5a4030" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 740,340 Q 850,300 940,330" stroke="#5a4030" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 1000,360 Q 1080,320 1160,350" stroke="#5a4030" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Front canopy leaves - large, detailed -->
    <ellipse cx="10" cy="320" rx="180" ry="140" fill="url(#leaf2)"/>
    <ellipse cx="220" cy="290" rx="200" ry="150" fill="url(#leaf1)"/>
    <ellipse cx="490" cy="310" rx="190" ry="145" fill="url(#leaf2)"/>
    <ellipse cx="740" cy="280" rx="210" ry="155" fill="url(#leaf1)"/>
    <ellipse cx="1000" cy="300" rx="195" ry="150" fill="url(#leaf2)"/>
    <ellipse cx="1180" cy="320" rx="170" ry="135" fill="url(#leaf1)"/>

    <!-- Leaf detail clusters -->
    <ellipse cx="100" cy="350" rx="80" ry="60" fill="#5cb85c" opacity="0.7"/>
    <ellipse cx="300" cy="320" rx="90" ry="70" fill="#6ec96e" opacity="0.7"/>
    <ellipse cx="560" cy="340" rx="85" ry="65" fill="#5cb85c" opacity="0.7"/>
    <ellipse cx="820" cy="310" rx="95" ry="75" fill="#6ec96e" opacity="0.7"/>
    <ellipse cx="1080" cy="330" rx="80" ry="60" fill="#5cb85c" opacity="0.7"/>
  </g>

  <!-- Light gaps in canopy - where sun shines through -->
  <g opacity="0.6">
    <ellipse cx="380" cy="200" rx="60" ry="40" fill="#fff8e1" opacity="0.5"/>
    <ellipse cx="650" cy="180" rx="50" ry="35" fill="#fff8e1" opacity="0.4"/>
    <ellipse cx="900" cy="210" rx="55" ry="38" fill="#fff8e1" opacity="0.45"/>
  </g>

  <!-- Photosynthesis visualization - glowing nodes on leaves -->
  <g>
    <circle cx="200" cy="350" r="25" fill="url(#photoGlow)"/>
    <circle cx="450" cy="380" r="20" fill="url(#photoGlow)"/>
    <circle cx="700" cy="340" r="22" fill="url(#photoGlow)"/>
    <circle cx="950" cy="370" r="18" fill="url(#photoGlow)"/>
    <circle cx="350" cy="420" r="15" fill="url(#photoGlow)"/>
    <circle cx="600" cy="400" r="20" fill="url(#photoGlow)"/>
    <circle cx="850" cy="430" r="17" fill="url(#photoGlow)"/>
  </g>

  <!-- CO2 → O2 molecular hints -->
  <g font-family="monospace" font-size="14" fill="#90EE90" opacity="0.4">
    <text x="180" y="360">CO₂</text>
    <text x="430" y="390">CO₂</text>
    <text x="680" y="350">CO₂</text>
    <text x="930" y="380">CO₂</text>
  </g>
  <g font-family="monospace" font-size="14" fill="#87CEEB" opacity="0.35">
    <text x="210" y="340">O₂</text>
    <text x="460" y="370">O₂</text>
    <text x="710" y="330">O₂</text>
    <text x="960" y="360">O₂</text>
  </g>

  <!-- Energy flow arrows (sunlight → leaves) -->
  <g stroke="#ffe082" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 380,100 L 370,200 L 360,280"/>
    <path d="M 650,80 L 645,180 L 640,270"/>
    <path d="M 900,110 L 895,210 L 890,290"/>
    <!-- Arrow heads -->
    <polygon points="355,280 365,275 360,285" fill="#ffe082"/>
    <polygon points="635,270 645,265 640,275" fill="#ffe082"/>
    <polygon points="885,290 895,285 890,295" fill="#ffe082"/>
  </g>

  <!-- Subtle data overlay - scientific measurement feel -->
  <g font-family="monospace" font-size="11" fill="#90EE90" opacity="0.35">
    <text x="50" y="700">PAR: 1,240 μmol/m²/s</text>
    <text x="50" y="720">LAI: 4.2</text>
    <text x="50" y="740">fAPAR: 0.87</text>
    <text x="50" y="760">GPP: 18.3 gC/m²/day</text>
  </g>

  <!-- Bottom foliage fill -->
  <rect x="0" y="650" width="1200" height="150" fill="#2d5a35" opacity="0.5"/>
  <ellipse cx="100" cy="680" rx="200" ry="80" fill="#3d7a4a" opacity="0.4"/>
  <ellipse cx="400" cy="690" rx="250" ry="90" fill="#3d7a4a" opacity="0.4"/>
  <ellipse cx="750" cy="670" rx="220" ry="85" fill="#3d7a4a" opacity="0.4"/>
  <ellipse cx="1050" cy="685" rx="230" ry="80" fill="#3d7a4a" opacity="0.4"/>
</svg>
